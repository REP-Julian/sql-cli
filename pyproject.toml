[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlcli-workbench"
version = "0.1.0"
description = "Interactive, schema-aware MySQL terminal workbench for XAMPP"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.43,<4",
    "mysql-connector-python>=8.4,<10",
    "python-dotenv>=1.0,<2",
    "tabulate>=0.9,<1",
]

[project.scripts]
sqlcli = "sqlcli.cli:main"

[tool.setuptools.packages.find]
include = ["sqlcli*"]
